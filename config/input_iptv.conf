# TrimUI Gamepad & Keyboard bindings for MPV player in IPTV Channel Guide mode

# Physical B / BACK / MENU: Quit player and return to RomCloud
GAMEPAD_ACTION_DOWN quit
JOY_BUTTON0 quit
b quit
q quit
ESC quit
GAMEPAD_BACK quit
GAMEPAD_MENU quit

# Physical A / Enter / Space: Ignored in MPV, handled by RomCloud to switch channel
GAMEPAD_ACTION_RIGHT ignore
JOY_BUTTON1 ignore
ENTER ignore
SPACE ignore

# D-Pad: Ignored in MPV, handled by RomCloud to navigate bottom channel list
GAMEPAD_DPAD_UP ignore
GAMEPAD_DPAD_DOWN ignore
GAMEPAD_DPAD_LEFT ignore
GAMEPAD_DPAD_RIGHT ignore
UP ignore
DOWN ignore
LEFT ignore
RIGHT ignore

# Volume controls via Shoulders
GAMEPAD_LEFT_SHOULDER add volume -5 ; show-text "{\\an5\\fs80\\bord3\\b1}▼  Âm lượng: ${volume}%" 1400
GAMEPAD_RIGHT_SHOULDER add volume 5 ; show-text "{\\an5\\fs80\\bord3\\b1}▲  Âm lượng: ${volume}%" 1400

# Physical X: Cycle Aspect Ratio
GAMEPAD_ACTION_LEFT cycle-values video-aspect-override "16:9" "4:3" "-1" ; show-text "{\\an5\\fs75\\bord3\\b1}Tỉ lệ: ${video-aspect-override}" 1400
x cycle-values video-aspect-override "16:9" "4:3" "-1" ; show-text "{\\an5\\fs75\\bord3\\b1}Tỉ lệ: ${video-aspect-override}" 1400
