# TrimUI Gamepad & Keyboard bindings for MPV player in RomCloud IPTV
# Gamepad bindings (SDL2 Gamepad API used by mpv)
# On TrimUI Brick Pro (X360 layout):
# Bottom button (Physical B) = GAMEPAD_ACTION_DOWN / JOY_BUTTON0 -> QUIT
# Right button (Physical A) = GAMEPAD_ACTION_RIGHT / JOY_BUTTON1 -> PAUSE/PLAY
GAMEPAD_ACTION_DOWN quit
JOY_BUTTON0 quit
GAMEPAD_ACTION_RIGHT cycle pause
JOY_BUTTON1 cycle pause

# Aspect ratio controls (4:3 / 16:9 / Auto toggle)
# Button X (Left button): Cycle Aspect Ratio (16:9 -> 4:3 -> Auto)
GAMEPAD_ACTION_LEFT cycle-values video-aspect-override "16:9" "4:3" "-1"
x cycle-values video-aspect-override "16:9" "4:3" "-1"

# Button Y (Top button): Cycle Letterbox vs Fullscreen Zoom Fill (panscan)
GAMEPAD_ACTION_UP cycle-values panscan 0.0 1.0
y cycle-values panscan 0.0 1.0

# Menu / Back / Select / Start all exit safely back to RomCloud
GAMEPAD_BACK quit
GAMEPAD_MENU quit
GAMEPAD_START quit
JOY_START quit
JOY_SELECT quit

# D-Pad for volume & seek
GAMEPAD_DPAD_UP add volume 5
GAMEPAD_DPAD_DOWN add volume -5
GAMEPAD_DPAD_LEFT seek -5
GAMEPAD_DPAD_RIGHT seek 5
GAMEPAD_LEFT_SHOULDER seek -30
GAMEPAD_RIGHT_SHOULDER seek 30

# Keyboard fallback
b quit
q quit
ESC quit
SPACE cycle pause
ENTER cycle pause
UP add volume 5
DOWN add volume -5
LEFT seek -5
RIGHT seek 5
