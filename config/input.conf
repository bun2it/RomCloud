# TrimUI Gamepad & Keyboard bindings for MPV player in RomCloud YouTube & IPTV
# Gamepad bindings (SDL2 Gamepad API used by mpv)
# On TrimUI Brick Pro / Smart Pro (X360 layout):

# Physical B: Quit back to RomCloud
GAMEPAD_ACTION_DOWN quit
JOY_BUTTON0 quit
b quit
q quit
ESC quit

# Physical A: Pause / Play toggle with centered OSD
GAMEPAD_ACTION_RIGHT cycle pause ; show-text "{\\an5\\fs95\\bord3\\b1}${?pause==yes:❚❚  TẠM DỪNG}${!pause==yes:▶  ĐANG PHÁT}" 1400
JOY_BUTTON1 cycle pause ; show-text "{\\an5\\fs95\\bord3\\b1}${?pause==yes:❚❚  TẠM DỪNG}${!pause==yes:▶  ĐANG PHÁT}" 1400
SPACE cycle pause ; show-text "{\\an5\\fs95\\bord3\\b1}${?pause==yes:❚❚  TẠM DỪNG}${!pause==yes:▶  ĐANG PHÁT}" 1400
ENTER cycle pause ; show-text "{\\an5\\fs95\\bord3\\b1}${?pause==yes:❚❚  TẠM DỪNG}${!pause==yes:▶  ĐANG PHÁT}" 1400

# Physical X: Cycle Aspect Ratio
GAMEPAD_ACTION_LEFT cycle-values video-aspect-override "16:9" "4:3" "-1" ; show-text "{\\an5\\fs75\\bord3\\b1}Tỉ lệ: ${video-aspect-override}" 1400
x cycle-values video-aspect-override "16:9" "4:3" "-1" ; show-text "{\\an5\\fs75\\bord3\\b1}Tỉ lệ: ${video-aspect-override}" 1400

# Physical Y: Cycle Subtitle / CC
GAMEPAD_ACTION_UP cycle sub ; show-text "{\\an5\\fs75\\bord3\\b1}Phụ đề CC: ${sub}" 1400
y cycle sub ; show-text "{\\an5\\fs75\\bord3\\b1}Phụ đề CC: ${sub}" 1400
j cycle sub ; show-text "{\\an5\\fs75\\bord3\\b1}Phụ đề CC: ${sub}" 1400

# D-Pad Left / Right: Tua lùi / Tua tới 10 giây với OSD to chính giữa màn hình
GAMEPAD_DPAD_LEFT no-osd seek -10 ; show-text "{\\an5\\fs95\\bord3\\b1}◀◀  -10s" 1400
GAMEPAD_DPAD_RIGHT no-osd seek 10 ; show-text "{\\an5\\fs95\\bord3\\b1}▶▶  +10s" 1400
LEFT no-osd seek -10 ; show-text "{\\an5\\fs95\\bord3\\b1}◀◀  -10s" 1400
RIGHT no-osd seek 10 ; show-text "{\\an5\\fs95\\bord3\\b1}▶▶  +10s" 1400

# Shoulders L1 / R1: Nhảy nhanh 60 giây (1 phút)
GAMEPAD_LEFT_SHOULDER no-osd seek -60 ; show-text "{\\an5\\fs90\\bord3\\b1}◀◀  -60s" 1400
GAMEPAD_RIGHT_SHOULDER no-osd seek 60 ; show-text "{\\an5\\fs90\\bord3\\b1}▶▶  +60s" 1400

# D-Pad Up / Down: Âm lượng
GAMEPAD_DPAD_UP add volume 5 ; show-text "{\\an5\\fs80\\bord3\\b1}▲  Âm lượng: ${volume}%" 1400
GAMEPAD_DPAD_DOWN add volume -5 ; show-text "{\\an5\\fs80\\bord3\\b1}▼  Âm lượng: ${volume}%" 1400
UP add volume 5 ; show-text "{\\an5\\fs80\\bord3\\b1}▲  Âm lượng: ${volume}%" 1400
DOWN add volume -5 ; show-text "{\\an5\\fs80\\bord3\\b1}▼  Âm lượng: ${volume}%" 1400

# START: Đổi tốc độ phát
GAMEPAD_START cycle-values speed "1.0" "1.25" "1.5" "0.75" ; show-text "{\\an5\\fs80\\bord3\\b1}Tốc độ: ${speed}x" 1400

# SELECT / BACK / MENU: Thoát an toàn
GAMEPAD_BACK quit
GAMEPAD_MENU quit
